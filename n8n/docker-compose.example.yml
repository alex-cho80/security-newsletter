services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:2.5.0
    container_name: n8n
    ports:
      - "5678:5678"
    environment:
      - GENERIC_TIMEZONE=Asia/Seoul
      - TZ=Asia/Seoul
      - N8N_ENCRYPTION_KEY=<CHANGE_ME: openssl rand -hex 32>
      - N8N_SECURE_COOKIE=false
      - N8N_EDITOR_BASE_URL=http://n8n.smlab.co.kr:5678
      - WEBHOOK_URL=http://n8n.smlab.co.kr:5678/
    volumes:
      - n8n_data:/home/node/.n8n
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  n8n_data:
